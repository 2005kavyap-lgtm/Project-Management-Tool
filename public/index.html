<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanPulse — Collaborative Project Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">⚡</div>
          <span>PlanPulse</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">
          <span>PROJECT BOARDS</span>
          <button class="btn-add-project" onclick="openModal('projectModal')" title="Create New Project">+</button>
        </div>
        <div class="projects-list" id="projectsListContainer">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>

      <!-- Current User Profile in Sidebar -->
      <div id="sidebarUserArea" style="margin-top: auto;">
        <!-- Populated dynamically by app.js -->
      </div>
    </aside>

    <!-- MAIN BOARD AREA -->
    <main class="main-content">
      <!-- Top Navigation / Header -->
      <header class="top-header">
        <div class="header-left">
          <div class="current-project-title" id="currentProjectTitle">
            Loading Project...
          </div>
          <div class="live-badge" id="liveStatusBadge" style="display: none;">
            <div class="live-dot"></div>
            <span>Live Sync</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="btn-icon" onclick="toggleNotificationsDrawer()" title="Notifications">
            🔔
            <span class="badge-counter" id="notifBadge" style="display: none;">0</span>
          </button>
          <button class="btn-primary" onclick="openQuickAddTask('todo')">
            <span>+</span>
            <span>Add Task</span>
          </button>
        </div>
      </header>

      <!-- Notifications Dropdown Drawer -->
      <div class="notifications-drawer" id="notificationsDrawer">
        <div class="drawer-header">
          <h3>Activity Notifications</h3>
          <button class="drawer-close" onclick="toggleNotificationsDrawer()">✕</button>
        </div>
        <div class="notifications-list" id="notificationsList">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- KANBAN BOARD COLUMNS -->
      <section class="board-container">
        <!-- Column 1: To Do -->
        <div class="kanban-column"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event, 'todo')">
          <div class="column-header">
            <div class="column-title-group">
              <span class="project-dot" style="background-color: #64748b;"></span>
              <span class="column-title">To Do</span>
              <span class="column-count" id="count-todo">0</span>
            </div>
            <button class="btn-icon" style="width: 26px; height: 26px; border: none; font-size: 1rem;" onclick="openQuickAddTask('todo')" title="Add task to To Do">+</button>
          </div>
          <div class="column-cards" id="cards-todo"></div>
          <button class="btn-add-task-col" onclick="openQuickAddTask('todo')">+ Add task</button>
        </div>

        <!-- Column 2: In Progress -->
        <div class="kanban-column"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event, 'in_progress')">
          <div class="column-header">
            <div class="column-title-group">
              <span class="project-dot" style="background-color: #3b82f6;"></span>
              <span class="column-title">In Progress</span>
              <span class="column-count" id="count-in_progress">0</span>
            </div>
            <button class="btn-icon" style="width: 26px; height: 26px; border: none; font-size: 1rem;" onclick="openQuickAddTask('in_progress')" title="Add task to In Progress">+</button>
          </div>
          <div class="column-cards" id="cards-in_progress"></div>
          <button class="btn-add-task-col" onclick="openQuickAddTask('in_progress')">+ Add task</button>
        </div>

        <!-- Column 3: In Review -->
        <div class="kanban-column"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event, 'in_review')">
          <div class="column-header">
            <div class="column-title-group">
              <span class="project-dot" style="background-color: #f59e0b;"></span>
              <span class="column-title">In Review</span>
              <span class="column-count" id="count-in_review">0</span>
            </div>
            <button class="btn-icon" style="width: 26px; height: 26px; border: none; font-size: 1rem;" onclick="openQuickAddTask('in_review')" title="Add task to In Review">+</button>
          </div>
          <div class="column-cards" id="cards-in_review"></div>
          <button class="btn-add-task-col" onclick="openQuickAddTask('in_review')">+ Add task</button>
        </div>

        <!-- Column 4: Done -->
        <div class="kanban-column"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event, 'done')">
          <div class="column-header">
            <div class="column-title-group">
              <span class="project-dot" style="background-color: #10b981;"></span>
              <span class="column-title">Done</span>
              <span class="column-count" id="count-done">0</span>
            </div>
            <button class="btn-icon" style="width: 26px; height: 26px; border: none; font-size: 1rem;" onclick="openQuickAddTask('done')" title="Add task to Done">+</button>
          </div>
          <div class="column-cards" id="cards-done"></div>
          <button class="btn-add-task-col" onclick="openQuickAddTask('done')">+ Add task</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ==========================================
       MODALS
       ========================================== -->

  <!-- 1. AUTHENTICATION MODAL -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box" style="max-width: 460px;">
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn" id="tabLoginBtn" onclick="switchAuthTab('login')">Sign In</button>
        <button type="button" class="auth-tab-btn" id="tabRegBtn" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event); return false;">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="sarah@planpulse.io" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Sign In</button>

        <div class="demo-box">
          <div class="demo-title">Quick Demo Sign-In (1-Click)</div>
          <div class="demo-pills">
            <span class="demo-pill" onclick="fillDemoAccount('sarah@planpulse.io')">Sarah (Lead Dev)</span>
            <span class="demo-pill" onclick="fillDemoAccount('alex@planpulse.io')">Alex (Backend)</span>
            <span class="demo-pill" onclick="fillDemoAccount('elena@planpulse.io')">Elena (UI/UX)</span>
            <span class="demo-pill" onclick="fillDemoAccount('marcus@planpulse.io')">Marcus (DevOps)</span>
          </div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event); return false;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label>Work Email</label>
          <input type="email" id="regEmail" class="form-input" placeholder="jane@company.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="Min 6 characters" required>
        </div>
        <div class="form-group">
          <label>Role / Job Title</label>
          <input type="text" id="regRole" class="form-input" placeholder="Product Designer, Full Stack Dev, etc.">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Create Account</button>
      </form>
    </div>
  </div>

  <!-- 2. CREATE PROJECT MODAL -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-box" style="max-width: 480px;">
      <div class="modal-header">
        <h2 class="modal-title">Create Project Board</h2>
        <button class="modal-close" onclick="closeModal('projectModal')">✕</button>
      </div>
      <form id="createProjectForm" onsubmit="handleCreateProject(event); return false;">
        <div class="form-group">
          <label>Board Title</label>
          <input type="text" id="newProjectTitle" class="form-input" placeholder="e.g. Mobile App Redesign" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="newProjectDesc" class="form-input" rows="3" placeholder="Brief goals and summary of this project..."></textarea>
        </div>
        <div class="form-group">
          <label>Theme Color</label>
          <select id="newProjectColor" class="form-input">
            <option value="#6366f1">Indigo (Default)</option>
            <option value="#06b6d4">Cyan</option>
            <option value="#10b981">Emerald Green</option>
            <option value="#f59e0b">Amber Orange</option>
            <option value="#ec4899">Pink</option>
            <option value="#8b5cf6">Purple</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('projectModal')">Cancel</button>
          <button type="submit" class="btn-primary">Create Board</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. CREATE TASK MODAL -->
  <div class="modal-overlay" id="newTaskModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">Add New Task</h2>
        <button class="modal-close" onclick="closeModal('newTaskModal')">✕</button>
      </div>
      <form id="createTaskForm" onsubmit="handleCreateTask(event); return false;">
        <input type="hidden" id="newTaskStatus" value="todo">
        
        <div class="form-group">
          <label>Task Title</label>
          <input type="text" id="newTaskTitle" class="form-input" placeholder="What needs to be done?" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="newTaskDesc" class="form-input" rows="3" placeholder="Add any details, checklists, or context..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Priority</label>
            <select id="newTaskPriority" class="form-input">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assignee</label>
            <select id="newTaskAssignee" class="form-input">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="newTaskDueDate" class="form-input">
          </div>
          <div class="form-group">
            <label>Label / Tag</label>
            <input type="text" id="newTaskLabel" class="form-input" placeholder="Frontend, Backend, Security...">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('newTaskModal')">Cancel</button>
          <button type="submit" id="btnSubmitCreateTask" class="btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. TASK DETAIL & COMMENTS MODAL -->
  <div class="modal-overlay" id="taskDetailModal">
    <div class="modal-box" style="max-width: 650px;">
      <div class="modal-header">
        <h2 class="modal-title">Task Details</h2>
        <button class="modal-close" onclick="closeTaskModal()">✕</button>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="detailTaskTitle" class="form-input" style="font-weight: 700; font-size: 1.05rem;">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="detailTaskDesc" class="form-input" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Column Status</label>
          <input type="text" id="detailTaskStatus" class="form-input" readonly style="background: var(--bg-app); text-transform: capitalize;">
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="detailTaskPriority" class="form-input">
            <option value="urgent">Urgent</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Assigned To</label>
          <select id="editTaskAssignee" class="form-input">
            <option value="">Unassigned</option>
          </select>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="detailTaskDueDate" class="form-input">
        </div>
      </div>

      <div class="form-group">
        <label>Label / Tag</label>
        <input type="text" id="detailTaskLabel" class="form-input">
      </div>

      <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem;">
        <button type="button" class="btn-primary" onclick="handleSaveTaskDetails()">💾 Save Changes</button>
        <button type="button" class="btn-danger" onclick="handleDeleteCurrentTask()">🗑️ Delete Task</button>
      </div>

      <!-- In-Task Communication / Comments -->
      <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--text-main);">
          Discussion & Comments
        </h3>

        <div class="comments-list" id="taskCommentsContainer">
          <!-- Comments loaded dynamically -->
        </div>

        <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
          <input type="text" id="newCommentInput" class="form-input" placeholder="Type a comment or status update..." onkeydown="if(event.key==='Enter') handleAddComment()">
          <button type="button" class="btn-primary" onclick="handleAddComment()" style="white-space: nowrap;">Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notification container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
